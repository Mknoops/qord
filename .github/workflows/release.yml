name: Release

# Pushing a tag vX.Y.Z (matching project(... VERSION X.Y.Z) in CMakeLists.txt)
# builds every package through build.yml and publishes them, with SHA256SUMS,
# as a GitHub Release. Running it by hand rebuilds the packages for an
# existing tag and replaces the release's files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tag matches the project version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ver=$(grep -oP 'project\(acheron VERSION \K[0-9.]+' CMakeLists.txt)
          if [ "$TAG" != "v$ver" ]; then
            echo "Tag $TAG does not match CMakeLists.txt version $ver (expected v$ver)"
            exit 1
          fi
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "CHANGELOG.md has no [$ver] section"; exit 1; }

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that can write: it creates the release and uploads its files
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum Qord-* > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ver="${TAG#v}"
          # This version's CHANGELOG section, without its heading
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Verifying a download

          Every file is listed in `SHA256SUMS`. On Linux or macOS run
          `sha256sum -c SHA256SUMS --ignore-missing` (macOS: `shasum -a 256 -c SHA256SUMS --ignore-missing`)
          in the download folder; on Windows compare `Get-FileHash <file>` with its line.
          The builds are made by this repository's
          [Release workflow](https://github.com/${{ github.repository }}/actions/workflows/release.yml)
          from the tagged source.
          EOF
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Qord ${TAG#v}" --notes-file notes.md --verify-tag
          fi
