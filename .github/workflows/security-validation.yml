name: Isolated security validation

on:
  pull_request:
    branches: [qord]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        qt: ['5', '6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install system toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap cmake ninja-build g++ pkg-config \
            libcurl4-openssl-dev libssl-dev libsecret-1-dev zlib1g-dev libsodium-dev libopus-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libgl1-mesa-dev libxkbcommon0 libxcb-cursor0 fonts-dejavu-core \
            qtbase5-dev qttools5-dev libqt5svg5-dev
          git -c core.hooksPath=/dev/null submodule update --init --depth 1 \
            vendor/qtkeychain vendor/emoji-segmenter vendor/qrcodegen vendor/miniaudio
      - name: Prepare pinned WebSocket-capable curl toolchain
        run: |
          curl --fail --location --proto '=https' --max-time 120 \
            -o "$RUNNER_TEMP/security-curl.tar.gz" \
            https://github.com/lexiforest/curl-impersonate/releases/download/v2.0.0/libcurl-impersonate-v2.0.0.x86_64-linux-gnu.tar.gz
          echo "d8a98bc123fae4f04bb6a7584ff486333a334b3b08edaba1867929ae8d6ebb4d  $RUNNER_TEMP/security-curl.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/security-curl"
          tar -xzf "$RUNNER_TEMP/security-curl.tar.gz" -C "$RUNNER_TEMP/security-curl"
      - name: Install Qt 6 toolchain
        if: matrix.qt == '6'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125
        with:
          version: '6.10.2'
          cache: false
      - name: Build and test with no external network
        env:
          TEST_QT_MAJOR: ${{ matrix.qt }}
        run: |
          set -eu
          work="${RUNNER_TEMP}/security-${TEST_QT_MAJOR}"
          mkdir -p "$work/home" "$work/runtime" "$work/tmp"
          chmod 700 "$work/runtime"
          qt_args=()
          if [ "$TEST_QT_MAJOR" = 6 ]; then
            qt_args=(--ro-bind "$QT_ROOT_DIR" /qt)
          fi
          # Only OS/toolchain inputs and read-only source enter the sandbox.
          # No runner home, sockets, credential files or inherited environment.
          timeout --signal=TERM --kill-after=15s 35m \
            sudo -n -- prlimit --as=12884901888 --cpu=1800 --nproc=512 --fsize=2147483648 -- \
            bwrap --unshare-pid --unshare-net --unshare-ipc --unshare-uts \
              --unshare-cgroup-try --die-with-parent --new-session --clearenv \
              --cap-add CAP_SETUID --cap-add CAP_SETGID --cap-add CAP_SETPCAP \
              --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/sbin /sbin \
              --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
              --ro-bind /etc/ld.so.cache /etc/ld.so.cache --ro-bind /etc/fonts /etc/fonts \
              --ro-bind "$GITHUB_WORKSPACE" /src --bind "$work" /work \
              --ro-bind "$RUNNER_TEMP/security-curl" /curl \
              --tmpfs /tmp --proc /proc --dev /dev "${qt_args[@]}" \
              --setenv PATH /usr/bin:/bin --setenv HOME /work/home \
              --setenv TMPDIR /work/tmp \
              --setenv FONTCONFIG_FILE /etc/fonts/fonts.conf \
              --setenv QT_QPA_PLATFORM offscreen --setenv XDG_RUNTIME_DIR /work/runtime \
              --setenv PYTHONDONTWRITEBYTECODE 1 --setenv TEST_QT_MAJOR "$TEST_QT_MAJOR" \
              --chdir /work /usr/bin/setpriv --reuid "$(id -u)" --regid "$(id -g)" \
              --clear-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs \
              /bin/bash --noprofile --norc -eu -o pipefail -c '
                python3 /src/tools/check_security_sandbox.py
                # Keep bundled release-backend TLS symbols local, just as
                # build.yml does; all binary processing stays inside isolation.
                mapfile -t keep_flags < <(nm --defined-only -g /curl/libcurl-impersonate.a |
                  sed -n "s/.* \(curl_[^ ]*\)$/--keep-global-symbol=\1/p" | sort -u)
                test "${#keep_flags[@]}" -gt 0
                objcopy "${keep_flags[@]}" /curl/libcurl-impersonate.a /work/libcurl-impersonate-local.a
                args=(-DUSE_VCPKG=OFF -DALLOW_PLAIN_CURL=OFF -DENABLE_VOICE=OFF
                      -DCURL_INCLUDE_DIR=/curl/include -DCURL_LIBRARY=/work/libcurl-impersonate-local.a
                      -DENABLE_FFMPEG=ON -DENABLE_LOTTIE=OFF -DBUILD_TESTS=ON -DBUILD_VOICE_CRYPTO_TESTS=ON
                      -DCMAKE_BUILD_TYPE=Debug)
                if [ "$TEST_QT_MAJOR" = 6 ]; then
                  args+=(-DCMAKE_PREFIX_PATH=/qt -DQT_VERSION=6.10.2)
                else
                  args+=(-DCMAKE_DISABLE_FIND_PACKAGE_Qt6=ON -DQT_VERSION=5.15.13)
                fi
                cmake -S /src -B /work/build -G Ninja "${args[@]}"
                cmake --build /work/build --parallel 2 -- -k 0
                ctest --test-dir /work/build --output-on-failure --timeout 90 -j2
                cd /src
                unset OLDPWD
                python3 -m unittest discover -s tools/tests -v
                python3 tools/check_equicord_plugins.py --check-docs
                python3 tools/check_mock_smoke.py /work/build/qord
              '
