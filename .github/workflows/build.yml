name: Build

on:
  push:
    branches: [qord, master, ci/**]
  pull_request:
    branches: [qord, master]
  # release.yml builds the release packages through this workflow, from the
  # commit it verified (never the ref the release run was started from)
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
        required: true

# Builds only read the repository; release.yml grants write to its publish job alone
permissions:
  contents: read

env:
  # The test binaries are GUI programs; runners have no display
  QT_QPA_PLATFORM: offscreen
  CURL_IMPERSONATE_VERSION: v2.0.0
  CURL_IMPERSONATE_WINDOWS_SHA256: 88e5b641a13b9a991857996947837c6f058cc3b0c9142ded0fc17b82008e98b2
  CURL_IMPERSONATE_LINUX_SHA256: d8a98bc123fae4f04bb6a7584ff486333a334b3b08edaba1867929ae8d6ebb4d
  CURL_IMPERSONATE_MACOS_SHA256: f8cc4ee6e4cc942fe6b52d905f8fe03ddebda5ffc428683e3b4e0f613cbfff17
  # AppImage tooling, pinned to tagged releases (not the moving "continuous" ones)
  LINUXDEPLOY_TAG: 1-alpha-20251107-1
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
  LINUXDEPLOY_QT_TAG: 1-alpha-20250213-1
  LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
  APPIMAGE_RUNTIME_TAG: "20251108"
  APPIMAGE_RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
  # BtbN keeps only the last couple of weeks of daily autobuilds plus one build per
  # month, so pin a month-end tag: a daily one gets deleted out from under us and
  # every ffmpeg download starts 404ing.
  FFMPEG_RELEASE_TAG: autobuild-2026-07-31-14-10
  FFMPEG_WINDOWS_BUILD: ffmpeg-n8.1.2-34-g9b6c8969e0-win64-lgpl-shared-8.1
  FFMPEG_WINDOWS_SHA256: c222a490dde4e7059f45495deef6bfb98dbcacc2b43df5b607546252037aa95c
  # Ubuntu 22.04's ffmpeg is 4.4, older than the 5.1 the player needs, so the
  # AppImage builds against this prebuilt prefix and bundles it.
  FFMPEG_LINUX_BUILD: ffmpeg-n8.1.2-34-g9b6c8969e0-linux64-lgpl-shared-8.1
  FFMPEG_LINUX_SHA256: c882a80f06617149198a98a07a0880a7e881953ae9f9cb931f5be09a4f93caae

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [MinSizeRel, RelWithDebInfo]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.2'
          modules: qtimageformats
          cache: true

      - name: Bootstrap vcpkg
        id: vcpkg-rev
        shell: pwsh
        run: |
          "rev=$(git -C vendor/vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          git -C vendor/vcpkg fetch --unshallow
          vendor/vcpkg/bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vcpkg_installed
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-overlay-ports/**', 'vcpkg-triplets/**', '.gitmodules') }}-${{ steps.vcpkg-rev.outputs.rev }}

      - name: Install curl-impersonate
        shell: pwsh
        run: |
          $url = "https://github.com/lexiforest/curl-impersonate/releases/download/${{ env.CURL_IMPERSONATE_VERSION }}/libcurl-impersonate-${{ env.CURL_IMPERSONATE_VERSION }}.x86_64-win32.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile libcurl-impersonate.tar.gz
          $actual = (Get-FileHash libcurl-impersonate.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "${{ env.CURL_IMPERSONATE_WINDOWS_SHA256 }}") {
            throw "curl-impersonate archive hash mismatch: expected ${{ env.CURL_IMPERSONATE_WINDOWS_SHA256 }}, got $actual"
          }
          New-Item -ItemType Directory -Path curl-impersonate -Force
          tar -xzf libcurl-impersonate.tar.gz -C curl-impersonate

      - name: Install ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ env.FFMPEG_RELEASE_TAG }}/${{ env.FFMPEG_WINDOWS_BUILD }}.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip

          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "${{ env.FFMPEG_WINDOWS_SHA256 }}") {
            throw "ffmpeg archive hash mismatch: expected ${{ env.FFMPEG_WINDOWS_SHA256 }}, got $actual"
          }

          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force

          $inner = Get-ChildItem -Path ffmpeg-extract -Directory | Select-Object -First 1
          Move-Item -Path $inner.FullName -Destination ffmpeg

      - name: Configure
        shell: pwsh
        run: |
          $curlDir = "${{ github.workspace }}/curl-impersonate"
          $ffmpegDir = "${{ github.workspace }}/ffmpeg"
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$ffmpegDir" `
            -DCURL_INCLUDE_DIR="$curlDir/include" `
            -DCURL_LIBRARY="$curlDir/lib/libcurl-impersonate_imp.lib" `
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Deploy Qt
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}/build/${{ matrix.build_type }}/qord.exe"
          windeployqt --no-translations --no-opengl-sw --no-system-d3d-compiler $exe

      - name: Prepare artifact
        shell: pwsh
        run: |
          $out = "qord-windows-${{ matrix.build_type }}"
          $binDir = "build/${{ matrix.build_type }}"
          $curlDir = "${{ github.workspace }}/curl-impersonate"
          New-Item -ItemType Directory -Path $out -Force

          # Copy build output (binary, certs/, fonts/, and everything windeployqt placed alongside it)
          Copy-Item "$binDir/*" $out -Recurse -Force

          # Copy curl-impersonate DLL
          Copy-Item "$curlDir/lib/*.dll" $out -Force

          # Drop build leftovers, and the plugins the app can never reach: main.cpp
          # forces the Fusion style and Storage only ever opens QSQLITE
          Remove-Item "$out/Test*.exe","$out/*.pdb","$out/*.lib","$out/styles","$out/generic" `
            -Recurse -ErrorAction SilentlyContinue
          Get-ChildItem "$out/sqldrivers" -Exclude qsqlite.dll | Remove-Item

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qord-windows-${{ matrix.build_type }}
          path: qord-windows-${{ matrix.build_type }}

      - name: Package release (zip + installer)
        if: matrix.build_type == 'MinSizeRel'
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(acheron VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $name = "Qord-$ver-windows-x64"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Recurse qord-windows-MinSizeRel $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"

          # Inno Setup 6 ships on the hosted Windows images; fail rather than
          # install an unpinned copy if a runner lacks it
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 (ISCC.exe) not found on this runner" }
          & $iscc /Qp "/DAppVersion=$ver" "/DAppFiles=${{ github.workspace }}\$name" "/DOutputDir=${{ github.workspace }}\dist" packaging\windows\qord.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - name: Upload release package
        if: matrix.build_type == 'MinSizeRel'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/*

  build-windows-minimal:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.10.2'
          modules: qtimageformats
          cache: true

      - name: Bootstrap vcpkg
        id: vcpkg-rev
        shell: pwsh
        run: |
          "rev=$(git -C vendor/vcpkg rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          git -C vendor/vcpkg fetch --unshallow
          vendor/vcpkg/bootstrap-vcpkg.bat

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/vcpkg_installed
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-overlay-ports/**', 'vcpkg-triplets/**', '.gitmodules') }}-${{ steps.vcpkg-rev.outputs.rev }}

      - name: Install curl-impersonate
        shell: pwsh
        run: |
          $url = "https://github.com/lexiforest/curl-impersonate/releases/download/${{ env.CURL_IMPERSONATE_VERSION }}/libcurl-impersonate-${{ env.CURL_IMPERSONATE_VERSION }}.x86_64-win32.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile libcurl-impersonate.tar.gz
          $actual = (Get-FileHash libcurl-impersonate.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne "${{ env.CURL_IMPERSONATE_WINDOWS_SHA256 }}") {
            throw "curl-impersonate archive hash mismatch: expected ${{ env.CURL_IMPERSONATE_WINDOWS_SHA256 }}, got $actual"
          }
          New-Item -ItemType Directory -Path curl-impersonate -Force
          tar -xzf libcurl-impersonate.tar.gz -C curl-impersonate

      - name: Configure
        shell: pwsh
        run: |
          $curlDir = "${{ github.workspace }}/curl-impersonate"
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCURL_INCLUDE_DIR="$curlDir/include" `
            -DCURL_LIBRARY="$curlDir/lib/libcurl-impersonate_imp.lib" `
            -DBUILD_TESTS=ON `
            -DENABLE_VOICE=OFF `
            -DENABLE_RNNOISE=OFF `
            -DENABLE_FFMPEG=OFF

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Deploy Qt
        shell: pwsh
        run: |
